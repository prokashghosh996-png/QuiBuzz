services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: quibuzz
      POSTGRES_PASSWORD: quibuzz_local
      POSTGRES_DB: quibuzz
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - quibuzz_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quibuzz"]
      interval: 5s
      retries: 10
volumes:
  quibuzz_data:
